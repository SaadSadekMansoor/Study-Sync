<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Study Sync - Mutual Accountability</title>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body>

  <!-- App Header -->
  <header class="app-header">
    <h1>Study Sync</h1>
    <div class="user-badge" id="user-status">Status: Idle</div>
  </header>

  <main class="main-container">
    <!-- Partner & Time Zone Section -->
    <section class="card partner-card">
      <h2>Partner Dashboard</h2>
      <div class="partner-info">
        <p><strong>Partner:</strong> <span id="partner-name">Connecting...</span></p>
        <p><strong>Partner Local Time:</strong> <span id="partner-time">--:--</span></p>
        <p><strong>Streak:</strong> <span id="streak-counter">0 Days</span> 🔥</p>
      </div>
      <button id="nudge-btn" class="btn btn-secondary" disabled>Send Nudge 🔔</button>
    </section>

    <!-- Session Control & Verification Section -->
    <section class="card session-card">
      <h2>Active Session Control</h2>
      
      <!-- Session Setup -->
      <div id="setup-view">
        <label for="session-duration">Select Duration (Hours):</label>
        <select id="session-duration">
          <option value="1">1 Hour</option>
          <option value="2">2 Hours</option>
          <option value="3" selected>3 Hours</option>
        </select>
        <button id="start-session-btn" class="btn btn-primary">Schedule / Start Session</button>
      </div>

      <!-- Live Session View (Hidden by default) -->
      <div id="active-session-view" class="hidden">
        <div class="timer-display">
          <h3>Session Time Remaining</h3>
          <div id="session-clock">00:00:00</div>
          <div id="grace-period-notice" class="warning-text hidden">
            ⚠️ Grace Period Active: Submit opening photo within <span id="grace-timer">10:00</span>!
          </div>
        </div>

        <!-- Live Camera Feed (No File/Gallery Picker) -->
        <div class="camera-container">
          <video id="camera-feed" autoplay playsinline class="camera-view"></video>
          <canvas id="photo-canvas" class="hidden"></canvas>
          <button id="capture-btn" class="btn btn-danger">Take Live Verification Photo 📸</button>
        </div>
      </div>
    </section>

    <!-- Location & Activity Feed -->
    <section class="card location-card">
      <h2>Live Session Location</h2>
      <div id="location-status">Location Tracking: <span id="location-state">OFF</span></div>
      <div id="location-coords">GPS: Not Active</div>
    </section>
  </main>

<script type="module" src="js/app.js"></script>
</body>
</html>
